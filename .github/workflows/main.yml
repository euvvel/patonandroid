name: Build SNI Spoof APK Direct

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Target IP'
        default: '104.19.229.21'
      fake_sni:
        description: 'Fake SNI'
        default: 'www.hcaptcha.com'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 'latest'
        
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init
        
    - name: Create main.go for direct APK build
      run: |
        cat > main.go << 'EOF'
        package main
        
        import (
            "crypto/tls"
            "fmt"
            "net"
            "time"
        )
        
        func main() {
            targetIP := "${{ github.event.inputs.target_ip }}"
            fakeSNI := "${{ github.event.inputs.fake_sni }}"
            
            fmt.Println("SNI Spoof starting...")
            fmt.Printf("Target: %s, Fake SNI: %s\n", targetIP, fakeSNI)
            
            // Phase 1: Fake ClientHello
            conn1, _ := net.DialTimeout("tcp", targetIP+":443", 3*time.Second)
            tls1 := tls.Client(conn1, &tls.Config{ServerName: fakeSNI, InsecureSkipVerify: true})
            go tls1.Handshake()
            time.Sleep(50 * time.Millisecond)
            conn1.Close()
            
            time.Sleep(100 * time.Millisecond)
            
            // Phase 2: Real connection
            conn2, _ := net.DialTimeout("tcp", targetIP+":443", 5*time.Second)
            tls2 := tls.Client(conn2, &tls.Config{ServerName: fakeSNI, InsecureSkipVerify: true})
            if err := tls2.Handshake(); err == nil {
                fmt.Println("✅ SUCCESS! DPI whitelisted!")
            }
            
            // Keep running
            select {}
        }
        EOF
        
    - name: Build APK directly with gomobile
      run: |
        gomobile bind -target=android -o snispoof.aar .
        # Build a simple APK using gomobile build (not bind)
        gomobile build -target=android -o sni-spoof.apk .
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sni-spoof-apk
        path: |
          *.apk
          *.aar
