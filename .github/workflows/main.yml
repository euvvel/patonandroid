name: Build SNI Spoof APK

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Target IP address'
        required: false
        default: '104.19.229.21'
      fake_sni:
        description: 'Fake SNI domain'
        required: false
        default: 'www.hcaptcha.com'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install NDK 25c (compatible version)
      run: |
        # Remove the default NDK if it exists
        if [ -d "$ANDROID_HOME/ndk" ]; then
          rm -rf $ANDROID_HOME/ndk/*
        fi
        
        # Download and install NDK 25c specifically
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        mv android-ndk-r25c ndk/25.1.8937393
        
        # Set the NDK environment variable
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
        
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        gomobile init
        
    - name: Add mobile dependency
      run: |
        go get golang.org/x/mobile@latest
        go mod tidy
        
    - name: Build AAR from Go code
      run: |
        # Update config with workflow inputs
        sed -i "s/104.19.229.21/${{ github.event.inputs.target_ip }}/g" sni.go
        sed -i "s/www.hcaptcha.com/${{ github.event.inputs.fake_sni }}/g" sni.go
        
        # Build the AAR with explicit NDK path
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393
        gomobile bind -target=android -o app/libs/snispoof.aar .
        
    - name: Create gradle wrapper
      run: |
        cd app
        # Create simple gradle wrapper files
        cat > gradlew << 'EOF'
        #!/bin/sh
        GRADLE_VERSION=8.0
        GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
        GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
        GRADLE_DIR="gradle-${GRADLE_VERSION}"
        
        if [ ! -d "$GRADLE_DIR" ]; then
            wget -q $GRADLE_URL
            unzip -q $GRADLE_ZIP
            rm $GRADLE_ZIP
        fi
        
        $GRADLE_DIR/bin/gradle "$@"
        EOF
        chmod +x gradlew
        
    - name: Build APK
      run: |
        cd app
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sni-spoof-apk
        path: app/build/outputs/apk/release/*.apk
