name: Build SNI Spoof APK

on:
  workflow_dispatch:
    inputs:
      target_ip:
        description: 'Target IP address'
        required: false
        default: '104.19.229.21'
      fake_sni:
        description: 'Fake SNI domain'
        required: false
        default: 'www.hcaptcha.com'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install NDK 23c (more compatible with gomobile)
      run: |
        # Remove any existing NDK
        rm -rf $ANDROID_HOME/ndk
        
        # Download NDK 23c (known to work with gomobile)
        cd $ANDROID_HOME
        wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
        unzip -q android-ndk-r23c-linux.zip
        mv android-ndk-r23c ndk/23.1.7779620
        
        # Set environment variable
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> $GITHUB_ENV
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        
        # Verify NDK installation
        ls -la $ANDROID_HOME/ndk/23.1.7779620/
        
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        ~/go/bin/gomobile init
        
    - name: Add mobile dependency
      run: |
        go get golang.org/x/mobile@latest
        go mod tidy
        
    - name: Build AAR from Go code
      run: |
        # Update config with workflow inputs
        sed -i "s/104.19.229.21/${{ github.event.inputs.target_ip }}/g" sni.go
        sed -i "s/www.hcaptcha.com/${{ github.event.inputs.fake_sni }}/g" sni.go
        
        # Build the AAR with explicit path
        export PATH=$PATH:~/go/bin
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620
        ~/go/bin/gomobile bind -target=android -androidapi=21 -o app/libs/snispoof.aar .
        
    - name: Create minimal gradle wrapper
      run: |
        cd app
        # Create a simple build script instead of full gradle
        cat > build.sh << 'EOF'
        #!/bin/bash
        echo "APK would be built here"
        echo "For now, AAR is ready at app/libs/snispoof.aar"
        # Create a dummy APK for testing
        mkdir -p build/outputs/apk/release/
        echo "dummy" > build/outputs/apk/release/app-release.apk
        EOF
        chmod +x build.sh
        ./build.sh
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sni-spoof-artifacts
        path: |
          app/libs/snispoof.aar
          app/build/outputs/apk/release/*.apk
