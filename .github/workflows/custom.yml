name: Build SNI Spoof APKKK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build APK
      run: |
        # ============================================
        # CREATE ANDROID APP (Pure Java)
        # ============================================
        mkdir -p app/src/main/java/com/snispoof
        mkdir -p app/src/main/res/values
        
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.snispoof">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <application android:label="SNI Spoof" android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".ProxyService" android:exported="false" />
            </application>
        </manifest>
        EOF
        
        cat > app/src/main/java/com/snispoof/MainActivity.java << 'EOF'
        package com.snispoof;
        import android.content.Intent;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        
        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(50, 50, 50, 50);
                
                TextView title = new TextView(this);
                title.setText("SNI Spoof Proxy");
                title.setTextSize(22);
                title.setPadding(0, 0, 0, 30);
                
                TextView info = new TextView(this);
                info.setText("Target: 104.19.229.21:443\nFake SNI: www.hcaptcha.com\nProxy Port: 40443\n\nThis app creates a local proxy that forces all TLS connections to use www.hcaptcha.com as SNI, bypassing DPI censorship.");
                info.setTextSize(14);
                info.setPadding(0, 0, 0, 30);
                
                Button startBtn = new Button(this);
                startBtn.setText("START PROXY");
                startBtn.setTextSize(18);
                startBtn.setOnClickListener(v -> {
                    Intent intent = new Intent(MainActivity.this, ProxyService.class);
                    startForegroundService(intent);
                    Toast.makeText(MainActivity.this, "Proxy Started on port 40443", Toast.LENGTH_LONG).show();
                    startBtn.setEnabled(false);
                    startBtn.setText("PROXY RUNNING");
                });
                
                layout.addView(title);
                layout.addView(info);
                layout.addView(startBtn);
                setContentView(layout);
            }
        }
        EOF
        
        cat > app/src/main/java/com/snispoof/ProxyService.java << 'EOF'
        package com.snispoof;
        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;
        import android.util.Log;
        import java.io.IOException;
        import java.io.InputStream;
        import java.io.OutputStream;
        import java.net.ServerSocket;
        import java.net.Socket;
        import javax.net.ssl.SSLSocket;
        import javax.net.ssl.SSLSocketFactory;
        import javax.net.ssl.SSLContext;
        import javax.net.ssl.TrustManager;
        import javax.net.ssl.X509TrustManager;
        import java.security.cert.X509Certificate;
        import java.util.concurrent.ExecutorService;
        import java.util.concurrent.Executors;
        
        public class ProxyService extends Service {
            private static final String TAG = "SNIProxy";
            private static final String TARGET_IP = "104.19.229.21";
            private static final int TARGET_PORT = 443;
            private static final String FAKE_SNI = "www.hcaptcha.com";
            private static final int PROXY_PORT = 40443;
            
            private ServerSocket serverSocket;
            private ExecutorService executor;
            private boolean running = false;
            
            @Override
            public void onCreate() {
                super.onCreate();
                Log.d(TAG, "Service creating");
                createNotificationChannel();
                startForeground(1, createNotification());
                
                // Perform spoof sequence
                new Thread(this::performSpoof).start();
                
                // Start proxy server
                startProxyServer();
            }
            
            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                        "sni_channel",
                        "SNI Spoof Proxy",
                        NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }
            
            private Notification createNotification() {
                Notification.Builder builder = new Notification.Builder(this, "sni_channel")
                    .setContentTitle("SNI Spoof Proxy")
                    .setContentText("Running on 127.0.0.1:" + PROXY_PORT)
                    .setSmallIcon(android.R.drawable.ic_menu_share)
                    .setPriority(Notification.PRIORITY_LOW);
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    builder.setChannelId("sni_channel");
                }
                return builder.build();
            }
            
            private void performSpoof() {
                try {
                    Log.d(TAG, "Phase 1: Sending fake ClientHello to " + TARGET_IP);
                    
                    // Create trust manager that accepts all certificates
                    TrustManager[] trustAllCerts = new TrustManager[]{
                        new X509TrustManager() {
                            public X509Certificate[] getAcceptedIssuers() { return null; }
                            public void checkClientTrusted(X509Certificate[] certs, String authType) {}
                            public void checkServerTrusted(X509Certificate[] certs, String authType) {}
                        }
                    };
                    SSLContext sslContext = SSLContext.getInstance("TLS");
                    sslContext.init(null, trustAllCerts, new java.security.SecureRandom());
                    SSLSocketFactory factory = sslContext.getSocketFactory();
                    
                    // Fake connection - send and abort
                    Socket fakeSocket = new Socket(TARGET_IP, TARGET_PORT);
                    fakeSocket.setSoTimeout(3000);
                    SSLSocket fakeSSL = (SSLSocket) factory.createSocket(fakeSocket, TARGET_IP, TARGET_PORT, true);
                    fakeSSL.startHandshake();
                    Thread.sleep(50);
                    fakeSSL.close();
                    fakeSocket.close();
                    Log.d(TAG, "Fake ClientHello sent, connection killed");
                    
                    Thread.sleep(100);
                    
                    // Real connection to verify
                    Socket realSocket = new Socket(TARGET_IP, TARGET_PORT);
                    SSLSocket realSSL = (SSLSocket) factory.createSocket(realSocket, TARGET_IP, TARGET_PORT, true);
                    realSSL.startHandshake();
                    Log.d(TAG, "SUCCESS! DPI whitelisted!");
                    realSSL.close();
                    realSocket.close();
                    
                } catch (Exception e) {
                    Log.e(TAG, "Spoof failed: " + e.getMessage());
                }
            }
            
            private void startProxyServer() {
                executor = Executors.newCachedThreadPool();
                running = true;
                
                try {
                    serverSocket = new ServerSocket(PROXY_PORT);
                    Log.d(TAG, "Proxy listening on port " + PROXY_PORT);
                    
                    while (running) {
                        Socket clientSocket = serverSocket.accept();
                        executor.submit(() -> handleClient(clientSocket));
                    }
                } catch (IOException e) {
                    Log.e(TAG, "Server error: " + e.getMessage());
                }
            }
            
            private void handleClient(Socket clientSocket) {
                try {
                    // Create trust manager that accepts all certificates
                    TrustManager[] trustAllCerts = new TrustManager[]{
                        new X509TrustManager() {
                            public X509Certificate[] getAcceptedIssuers() { return null; }
                            public void checkClientTrusted(X509Certificate[] certs, String authType) {}
                            public void checkServerTrusted(X509Certificate[] certs, String authType) {}
                        }
                    };
                    SSLContext sslContext = SSLContext.getInstance("TLS");
                    sslContext.init(null, trustAllCerts, new java.security.SecureRandom());
                    SSLSocketFactory factory = sslContext.getSocketFactory();
                    
                    // Connect to target
                    Socket targetSocket = new Socket(TARGET_IP, TARGET_PORT);
                    SSLSocket targetSSL = (SSLSocket) factory.createSocket(targetSocket, TARGET_IP, TARGET_PORT, true);
                    targetSSL.setUseClientMode(true);
                    
                    // Force the fake SNI
                    java.lang.reflect.Field field = targetSSL.getClass().getDeclaredField("host");
                    field.setAccessible(true);
                    field.set(targetSSL, FAKE_SNI);
                    
                    targetSSL.startHandshake();
                    
                    // Proxy data
                    InputStream clientIn = clientSocket.getInputStream();
                    OutputStream clientOut = clientSocket.getOutputStream();
                    InputStream targetIn = targetSSL.getInputStream();
                    OutputStream targetOut = targetSSL.getOutputStream();
                    
                    Thread clientToTarget = new Thread(() -> {
                        try {
                            byte[] buffer = new byte[8192];
                            int len;
                            while ((len = clientIn.read(buffer)) > 0) {
                                targetOut.write(buffer, 0, len);
                                targetOut.flush();
                            }
                        } catch (IOException e) {}
                    });
                    
                    Thread targetToClient = new Thread(() -> {
                        try {
                            byte[] buffer = new byte[8192];
                            int len;
                            while ((len = targetIn.read(buffer)) > 0) {
                                clientOut.write(buffer, 0, len);
                                clientOut.flush();
                            }
                        } catch (IOException e) {}
                    });
                    
                    clientToTarget.start();
                    targetToClient.start();
                    
                    clientToTarget.join();
                    targetToClient.join();
                    
                    targetSSL.close();
                    targetSocket.close();
                    clientSocket.close();
                    
                } catch (Exception e) {
                    Log.e(TAG, "Proxy error: " + e.getMessage());
                    try { clientSocket.close(); } catch (IOException ex) {}
                }
            }
            
            @Override
            public void onDestroy() {
                running = false;
                try {
                    if (serverSocket != null) serverSocket.close();
                } catch (IOException e) {}
                if (executor != null) executor.shutdown();
                super.onDestroy();
            }
            
            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }
        }
        EOF
        
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.snispoof'
            compileSdk 34
            
            defaultConfig {
                applicationId "com.snispoof"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            
            signingConfigs {
                release {
                    storeFile file("../debug.keystore")
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
            
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                }
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        # Generate debug keystore
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" -storepass android -keypass android
        
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SNI Spoof"
        include ':app'
        EOF
        
        cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.0'
            }
        }
        EOF
        
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF
        
        mkdir -p gradle/wrapper
        cat > gradlew << 'EOF'
        #!/bin/sh
        java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        chmod +x gradlew
        
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
        
        # ============================================
        # BUILD APK
        # ============================================
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sni-spoof-proxy
        path: app/build/outputs/apk/release/*.apk
