name: Build SNI Spoof APKKK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build everything
      run: |
        # ============================================
        # 1. CREATE GO SNI SPOOF BINARY
        # ============================================
        cat > sni.go << 'EOF'
        package main
        
        import (
            "crypto/tls"
            "fmt"
            "io"
            "log"
            "net"
            "time"
        )
        
        const (
            TARGET_IP   = "104.19.229.21"
            TARGET_PORT = 443
            FAKE_SNI    = "www.hcaptcha.com"
            PROXY_PORT  = 40443
        )
        
        func main() {
            log.Printf("SNI Spoof Proxy starting...")
            log.Printf("Target: %s:%d, Fake SNI: %s", TARGET_IP, TARGET_PORT, FAKE_SNI)
            log.Printf("Proxy listening on 127.0.0.1:%d", PROXY_PORT)
            
            go performSpoof()
            startProxy()
        }
        
        func performSpoof() {
            time.Sleep(1 * time.Second)
            targetAddr := fmt.Sprintf("%s:%d", TARGET_IP, TARGET_PORT)
            
            fakeConn, _ := net.DialTimeout("tcp", targetAddr, 5*time.Second)
            fakeTLS := tls.Client(fakeConn, &tls.Config{ServerName: FAKE_SNI, InsecureSkipVerify: true})
            go fakeTLS.Handshake()
            time.Sleep(50 * time.Millisecond)
            fakeConn.Close()
            log.Printf("Fake ClientHello sent")
            
            time.Sleep(100 * time.Millisecond)
            
            realConn, _ := net.DialTimeout("tcp", targetAddr, 5*time.Second)
            defer realConn.Close()
            realTLS := tls.Client(realConn, &tls.Config{ServerName: FAKE_SNI, InsecureSkipVerify: true})
            if err := realTLS.Handshake(); err == nil {
                log.Printf("SUCCESS! DPI WHITELISTED!")
            }
        }
        
        func startProxy() {
            listener, _ := net.Listen("tcp", fmt.Sprintf("127.0.0.1:%d", PROXY_PORT))
            log.Printf("Proxy listening on 127.0.0.1:%d", PROXY_PORT)
            for {
                client, err := listener.Accept()
                if err != nil {
                    continue
                }
                go handle(client)
            }
        }
        
        func handle(client net.Conn) {
            defer client.Close()
            targetAddr := fmt.Sprintf("%s:%d", TARGET_IP, TARGET_PORT)
            target, err := net.DialTimeout("tcp", targetAddr, 10*time.Second)
            if err != nil {
                return
            }
            defer target.Close()
            
            tlsTarget := tls.Client(target, &tls.Config{ServerName: FAKE_SNI, InsecureSkipVerify: true})
            if err := tlsTarget.Handshake(); err != nil {
                return
            }
            
            go func() { io.Copy(tlsTarget, client) }()
            io.Copy(client, tlsTarget)
        }
        EOF
        
        # Build Android binary
        GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -o sni_proxy sni.go
        
        # ============================================
        # 2. CREATE ANDROID APP
        # ============================================
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/snispoof
        cp sni_proxy app/src/main/assets/
        
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.snispoof">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <application android:label="SNI Spoof" android:usesCleartextTraffic="true">
                <activity android:name=".MainActivity" android:exported="true"
                    android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".ProxyService" android:exported="false" />
            </application>
        </manifest>
        EOF
        
        cat > app/src/main/java/com/snispoof/MainActivity.java << 'EOF'
        package com.snispoof;
        import android.content.Intent;
        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;
        
        public class MainActivity extends AppCompatActivity {
            private TextView status;
            private Button startBtn;
            
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(50, 50, 50, 50);
                
                status = new TextView(this);
                status.setText("SNI Spoof Proxy\nStatus: STOPPED\n\nProxy: 127.0.0.1:40443\nForced SNI: www.hcaptcha.com\n\nUse v2ray/HTTP Custom with:\nAddress: 127.0.0.1\nPort: 40443");
                status.setTextSize(14);
                status.setPadding(0, 0, 0, 30);
                
                startBtn = new Button(this);
                startBtn.setText("START PROXY");
                startBtn.setTextSize(18);
                startBtn.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        Intent intent = new Intent(MainActivity.this, ProxyService.class);
                        startForegroundService(intent);
                        status.setText("SNI Spoof Proxy\nStatus: RUNNING\n\nProxy active on 127.0.0.1:40443\n\nDPI should be whitelisted now\nConfigure v2ray to use this proxy");
                        startBtn.setEnabled(false);
                        startBtn.setText("PROXY RUNNING");
                    }
                });
                
                layout.addView(status);
                layout.addView(startBtn);
                setContentView(layout);
            }
        }
        EOF
        
        cat > app/src/main/java/com/snispoof/ProxyService.java << 'EOF'
        package com.snispoof;
        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;
        import android.util.Log;
        import java.io.File;
        import java.io.FileOutputStream;
        import java.io.InputStream;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        
        public class ProxyService extends Service {
            private static final String TAG = "SNIProxy";
            private Process process;
            
            @Override
            public void onCreate() {
                super.onCreate();
                Log.d(TAG, "Service creating");
                createNotificationChannel();
                startForeground(1, createNotification());
                
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        startNativeProxy();
                    }
                }).start();
            }
            
            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                        "sni_channel",
                        "SNI Spoof Proxy",
                        NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }
            
            private Notification createNotification() {
                Notification.Builder builder = new Notification.Builder(this, "sni_channel")
                    .setContentTitle("SNI Spoof Proxy")
                    .setContentText("Running on 127.0.0.1:40443")
                    .setSmallIcon(android.R.drawable.ic_menu_share)
                    .setPriority(Notification.PRIORITY_LOW);
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    builder.setChannelId("sni_channel");
                }
                return builder.build();
            }
            
            private void startNativeProxy() {
                try {
                    File binary = new File(getFilesDir(), "sni_proxy");
                    if (!binary.exists()) {
                        Log.d(TAG, "Copying binary from assets");
                        try (InputStream in = getAssets().open("sni_proxy");
                             FileOutputStream out = new FileOutputStream(binary)) {
                            byte[] buffer = new byte[8192];
                            int len;
                            while ((len = in.read(buffer)) > 0) {
                                out.write(buffer, 0, len);
                            }
                        }
                    }
                    binary.setExecutable(true);
                    
                    Log.d(TAG, "Starting native proxy: " + binary.getAbsolutePath());
                    process = Runtime.getRuntime().exec(binary.getAbsolutePath());
                    
                    // Read output in background
                    new Thread(new Runnable() {
                        @Override
                        public void run() {
                            try {
                                BufferedReader reader = new BufferedReader(new InputStreamReader(process.getInputStream()));
                                String line;
                                while ((line = reader.readLine()) != null) {
                                    Log.d(TAG, "Proxy: " + line);
                                }
                            } catch (Exception e) {
                                Log.e(TAG, "Error reading output", e);
                            }
                        }
                    }).start();
                    
                    Log.d(TAG, "Native proxy started successfully");
                    
                } catch (Exception e) {
                    Log.e(TAG, "Failed to start native proxy", e);
                }
            }
            
            @Override
            public void onDestroy() {
                Log.d(TAG, "Service destroying");
                if (process != null) {
                    process.destroy();
                }
                super.onDestroy();
            }
            
            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }
        }
        EOF
        
        # Generate debug keystore
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US" -storepass android -keypass android
        
        # settings.gradle
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SNI Spoof"
        include ':app'
        EOF
        
        # build.gradle
        cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.5.0'
            }
        }
        EOF
        
        # app/build.gradle
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
        }
        
        android {
            namespace 'com.snispoof'
            compileSdk 34
            
            defaultConfig {
                applicationId "com.snispoof"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            
            signingConfigs {
                release {
                    storeFile file("../debug.keystore")
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
            
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        # gradle.properties
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF
        
        # gradle wrapper
        mkdir -p gradle/wrapper
        cat > gradlew << 'EOF'
        #!/bin/sh
        java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
        chmod +x gradlew
        
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
        
        # ============================================
        # 3. BUILD APK
        # ============================================
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sni-spoof-proxy
        path: app/build/outputs/apk/release/*.apk
